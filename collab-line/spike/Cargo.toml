[package]
name = "collab-spike"
version = "0.1.0"
edition = "2021"
publish = false

# 净室评估 spike（循 office-line/spike 先例）：分析仓工作区，零进 mdcore。
# 依赖 = 被 evaluate 的对象本尊 yrs（crates.io 钉版经 Cargo.lock）。
#
# d1c 起为 workspace：成员 adapter/ = D1-a 隔离适配层原型 crate
# （crate 边界 = 可撤回边界，yrs-b §6；yrs 版本与根包一致钉 0.28）。

[workspace]
members = ["adapter"]

[dependencies]
# features=["sync"] 自 P7 起开启：对齐 #676 上报口径（feature sync + 默认 GC）。
yrs = { version = "0.28", features = ["sync"] }
collab-adapter = { path = "adapter" }

[[bin]]
name = "p1_basics"
path = "src/bin/p1_basics.rs"

[[bin]]
name = "p2_merge_convergence"
path = "src/bin/p2_merge_convergence.rs"

[[bin]]
name = "p3_interop_write"
path = "src/bin/p3_interop_write.rs"

[[bin]]
name = "p3_interop_read"
path = "src/bin/p3_interop_read.rs"

[[bin]]
name = "p4_undo_origins"
path = "src/bin/p4_undo_origins.rs"

[[bin]]
name = "p5_scale_sanity"
path = "src/bin/p5_scale_sanity.rs"

[[bin]]
name = "p7_gc_undo_safety"
path = "src/bin/p7_gc_undo_safety.rs"

[[bin]]
name = "p8_adapter_load"
path = "src/bin/p8_adapter_load.rs"

[profile.release]
opt-level = 3

[[bin]]
name = "p9_adapter_sync_undo"
path = "src/bin/p9_adapter_sync_undo.rs"

[[bin]]
name = "p10_adapter_anchor_snapshot"
path = "src/bin/p10_adapter_anchor_snapshot.rs"

[[bin]]
name = "p11_carrier_comparison"
path = "src/bin/p11_carrier_comparison.rs"

[[bin]]
name = "p14_gc_evidence"
path = "src/bin/p14_gc_evidence.rs"

[[bin]]
name = "p12_sync_undo_cycles"
path = "src/bin/p12_sync_undo_cycles.rs"

[[bin]]
name = "p13_xml_carrier_deep"
path = "src/bin/p13_xml_carrier_deep.rs"
